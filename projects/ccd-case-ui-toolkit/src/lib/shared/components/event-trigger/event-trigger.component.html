<form *ngIf="triggers && triggers.length" class="event-trigger" (ngSubmit)="triggerSubmit()" [formGroup]="triggerForm">
  <div class="govuk-form-group" style="width: 350px !important;">
    <label class="govuk-label" for="next-step">{{'Next step' | rpxTranslate}}</label>
    <select class="govuk-select ccd-dropdown" id="next-step" (change)="triggerChange()" formControlName="trigger" [ngClass]="{
          'EventTrigger-empty': !triggerForm.value['trigger']
        }" [compareWith]="compareFn">
      <option *ngIf="1 !== triggers.length" value="" data-default>{{'Select action' | rpxTranslate}}</option>
      <option *ngFor="let trigger of triggers" [ngValue]="trigger"  [title]="trigger.description">{{trigger.name | rpxTranslate}}</option>
    </select>
  </div>
  <button [disabled]="isButtonDisabled()" type="submit" class="govuk-button">{{triggerText | rpxTranslate}}</button>
</form>
