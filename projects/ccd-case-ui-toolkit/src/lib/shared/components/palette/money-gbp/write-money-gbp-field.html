<div class="govuk-form-group bottom-30" [ngClass]="{'govuk-form-group--error': !moneyGbpControl.valid && (moneyGbpControl.dirty || moneyGbpControl.touched)}">

  <label class="govuk-label" [for]="id()">
    <ng-container *ngIf="caseField.label">{{caseField | ccdFieldLabel}}</ng-container>
  </label>
  <div class="govuk-hint" *ngIf="caseField.hint_text">{{caseField.hint_text | rpxTranslate}}</div>
  <span class="govuk-error-message" *ngIf="moneyGbpControl.errors && (moneyGbpControl.dirty || moneyGbpControl.touched)"><span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{moneyGbpControl.errors | ccdFirstError:caseField.label}}</span>

  <div class="form-money">
    <span class="form-currency">&#163;</span>
    <ccd-money-gbp-input [id]="id()"
                         [name]="id()"
                         [mandatory]="caseField | ccdIsMandatory"
                         [formControl]="moneyGbpControl"></ccd-money-gbp-input>
  </div>

</div>
