<div class="complex-panel">
  <dl class="complex-panel-title"><dt><span class="text-16">{{caseField.label | rpxTranslate}}</span></dt><dd></dd></dl>
  <table class="complex-panel-table" aria-label="complex field table">
    <tbody>
      @for (field of caseField | ccdReadFieldsFilter:false :undefined :true :topLevelFormGroup :path :idPrefix; track field) {
        <ng-container ccdLabelSubstitutor [caseField]="field" [formGroup]="topLevelFormGroup" [contextFields]="caseFields">
          @if ((field | ccdIsCompound)) {
            <tr class="complex-panel-compound-field" [hidden]="field.hidden">
              <td colspan="2">
                <span class="text-16">
                  <ccd-field-read [topLevelFormGroup]="topLevelFormGroup" [caseFields]="caseFields"
                  [caseField]="field" [context]="context"></ccd-field-read>
                </span>
              </td>
            </tr>
          } @else {
            <tr class="complex-panel-simple-field" [hidden]="field.hidden">
              @if (field.label) {
                <th scope="row"><span class="text-16">{{field.label | rpxTranslate}}</span></th>
              }
              @if (!field.label) {
                <td></td>
              }
              <td>
                <span class="text-16">
                  <ccd-field-read [topLevelFormGroup]="topLevelFormGroup" [caseFields]="caseFields"
                  [caseField]="field" [context]="context"></ccd-field-read>
                </span>
              </td>
            </tr>
          }
        </ng-container>
      }
    </tbody>
  </table>
</div>
