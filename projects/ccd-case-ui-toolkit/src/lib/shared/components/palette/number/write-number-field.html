<div class="govuk-form-group" [ngClass]="{'govuk-form-group--error': !numberControl.valid && numberControl.dirty}">
  <label class="govuk-label" [for]="id()">
    <ng-container *ngIf="caseField.label">{{caseField | ccdFieldLabel}}</ng-container>
  </label>
  <div class="govuk-hint" *ngIf="caseField.hint_text">{{caseField.hint_text | rpxTranslate}}</div>
  <span class="govuk-error-message" *ngIf="numberControl.errors && numberControl.dirty">
    <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{numberControl.errors | ccdFirstError:caseField.label}}
  </span>

  <input class="govuk-input bottom-30" [ngClass]="{'govuk-input--error': numberControl.errors && numberControl.dirty}"
   [id]="id()" type="text" inputmode="decimal" pattern="^[-+]?[0-9]+(?:\.?[0-9]+)?$" [formControl]="numberControl">
</div>
