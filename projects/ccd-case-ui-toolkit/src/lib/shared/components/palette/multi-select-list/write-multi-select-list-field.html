<div class="govuk-form-group bottom-30" [ngClass]="{'govuk-form-group--error': !checkboxes.valid && (checkboxes.dirty || checkboxes.touched)}" [id]="id()">

  <fieldset class="govuk-fieldset">

    <legend class="govuk-fieldset__legend">
      <ng-container *ngIf="caseField.label">{{caseField | ccdFieldLabel}}</ng-container>
    </legend>
    <div *ngIf="caseField.hint_text" class="govuk-hint">{{caseField.hint_text | rpxTranslate}}</div>
    <span *ngIf="checkboxes.errors && (checkboxes.dirty || checkboxes.touched)" class="govuk-error-message">
      <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{checkboxes.errors | ccdFirstError:caseField.label}}
    </span>

    <div class="govuk-checkboxes">
      <ng-container *ngFor="let checkbox of caseField.field_type.fixed_list_items">
        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input" [id]="id()+'-'+checkbox.code" [name]="id()" type="checkbox" [value]="checkbox.code" [checked]="isSelected(checkbox.code)" (change)="onCheckChange($event)">
          <label class="govuk-label govuk-checkboxes__label" [for]="id()+'-'+checkbox.code">{{checkbox.label | rpxTranslate}}</label>
        </div>
      </ng-container>
    </div>

  </fieldset>

</div>
