@if (caseField.value && caseField.value.length) {
  <table class="multi-select-list-field-table">
    <caption class="govuk-visually-hidden">{{ 'Multi selection table' | rpxTranslate }}</caption>
    <thead>
      <tr>
        <th scope="col" class="govuk-visually-hidden">{{ 'Value' | rpxTranslate }}</th>
      </tr>
    </thead>
    <tbody>
      @for (value of caseField.value; track value) {
        <tr>
          <td><span class="text-16">{{ value | ccdFixedList:caseField.field_type.fixed_list_items | rpxTranslate}}</span></td>
        </tr>
      }
    </tbody>
  </table>
}
