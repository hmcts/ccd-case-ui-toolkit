<div class="govuk-form-group" [id]="id()">
  <div *ngIf="!isComplexWithHiddenFields()">
    <h2 class="heading-h2">{{caseField | ccdFieldLabel}}</h2>

    <div class="govuk-form-group bottom-30 postcodeLookup" [id]="createElementId('postcodeLookup')" [ngClass]="{'govuk-form-group--error': missingPostcode}" *ngIf="!isExpanded">
      <label class="govuk-label" [for]="createElementId('postcodeInput')">
        {{'Enter a UK postcode' | rpxTranslate}}
      </label>
      <span class="govuk-error-message" *ngIf="missingPostcode">
        <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{errorMessage | rpxTranslate}}
      </span>
      <input type="text" [ngClass]="{'govuk-input--error': missingPostcode}"
      [id]="createElementId('postcodeInput')" name="postcode" class="govuk-input postcodeinput inline-block" [formControl]="postcode">
      <button type="button" class="govuk-button" (click)="findAddress()" [disabled]="loadingAddresses">
        {{(loadingAddresses ? 'Finding addresses...' : 'Find address') | rpxTranslate}}
      </button>
    </div>

    <div class="govuk-form-group" *ngIf="addressOptions" id="selectAddress" [ngClass]="{'govuk-form-group--error': noAddressSelected}">
      <label class="govuk-label" [for]="createElementId('addressList')">
        {{'Select an address' | rpxTranslate}}
      </label>
      <span class="govuk-error-message" *ngIf="noAddressSelected">
        <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{errorMessage | rpxTranslate}}
      </span>
      <select class="govuk-select ccd-dropdown addressList" [id]="createElementId('addressList')" name="address" [formControl]="addressList" (change)="addressSelected()" focusElement>
        <option *ngIf="addressOptions.length === 0" [ngValue]="undefined">
          {{'No address found' | rpxTranslate}}
        </option>
        <option *ngIf="addressOptions.length > 0" [ngValue]="undefined">
          {{addressOptions.length}} {{(addressOptions.length === 1 ? 'address found' : 'addresses found') | rpxTranslate}}
        </option>
        <option *ngFor="let addressOption of addressOptions" [ngValue]="addressOption.value">
          {{addressOption.description}}
        </option>
      </select>
    </div>

    <a class="manual-link bottom-30" *ngIf="!shouldShowDetailFields()" (click)="blankAddress(); $event.preventDefault()" href="#">
      {{"I can't enter a UK postcode" | rpxTranslate}}
    </a>
  </div>

  <ccd-write-complex-type-field
    [hidden]="!shouldShowDetailFields()"
    [caseField]="caseField"
    [renderLabel]="false"
    [parent]="parent"
    [formGroup]="formGroup"
    [ignoreMandatory]="true"
    [idPrefix]="buildIdPrefix('detail')"
    #writeComplexFieldComponent>
  </ccd-write-complex-type-field>
</div>
