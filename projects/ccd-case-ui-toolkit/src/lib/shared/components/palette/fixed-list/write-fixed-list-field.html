<div class="govuk-form-group" [ngClass]="{'govuk-form-group--error': !fixedListFormControl.valid && (fixedListFormControl.dirty || fixedListFormControl.touched)}">

  <label class="govuk-label" [for]="id()">
    <ng-container *ngIf="caseField.label">{{(caseField | ccdFieldLabel)}}</ng-container>
  </label>
  <div class="govuk-hint" *ngIf="caseField.hint_text">{{caseField.hint_text | rpxTranslate}}</div>
  <span class="govuk-error-message" *ngIf="fixedListFormControl.errors && (fixedListFormControl.dirty || fixedListFormControl.touched)">
    <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{(fixedListFormControl.errors | ccdFirstError:caseField.label)}}
  </span>

  <select class="govuk-select ccd-dropdown bottom-30" [id]="id()" [formControl]="fixedListFormControl">
    <option [ngValue]=null>--Select a value--</option>
    <option [ngValue]="type.code" *ngFor="let type of listItems">{{type.label | rpxTranslate}}</option>
  </select>

</div>
