<div class="govuk-form-group bottom-30" [ngClass]="{'govuk-form-group--error': !checkboxes.valid && checkboxes.touched}" [id]="id()">

  <fieldset class="govuk-fieldset">

    <legend class="govuk-fieldset__legend">
      <ng-container *ngIf="caseField.label">{{caseField | ccdFieldLabel}}</ng-container>
    </legend>
    <div *ngIf="caseField.hint_text" class="govuk-hint">{{caseField.hint_text}}</div>
    <span *ngIf="checkboxes.errors && checkboxes.touched" class="govuk-error-message">
      <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{checkboxes.errors | ccdFirstError}}
    </span>

    <div class="govuk-checkboxes">
      <ng-container *ngFor="let checkbox of caseField.list_items">

        <div class="govuk-checkboxes__item">
          <input class="govuk-checkboxes__input" id="{{ createElementId(checkbox.code) }}" name="{{ id() }}" type="checkbox"
            [value]="checkbox.code" [checked]="isSelected(checkbox.code)" (change)="onCheckChange($event)">
          <label class="govuk-label govuk-checkboxes__label" for="{{ createElementId(checkbox.code) }}">
            <ccd-markdown [content]="checkbox.label | rpxTranslate" [renderUrlToTextFeature]="false"></ccd-markdown>
          </label>
        </div>

      </ng-container>
    </div>

  </fieldset>

</div>
