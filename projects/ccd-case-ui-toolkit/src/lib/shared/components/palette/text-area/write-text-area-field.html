<div class="govuk-form-group" [ngClass]="{'govuk-form-group--error': !textareaControl.valid && textareaControl.dirty}">

  <label class="govuk-label" [for]="id()">
    <ng-container *ngIf="caseField.label">{{caseField | ccdFieldLabel}}</ng-container>
  </label>
  <div class="govuk-hint" *ngIf="caseField.hint_text">{{caseField.hint_text | rpxTranslate}}</div>
  <span class="govuk-error-message" *ngIf="textareaControl.errors && (textareaControl.dirty || textareaControl.touched)">
    <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{textareaControl.errors | ccdFirstError:caseField.label}}
  </span>

  <textarea (input)="autoGrow($event)" class="govuk-textarea bottom-30" [ngClass]="{'govuk-textarea--error': textareaControl.errors && (textareaControl.dirty || textareaControl.touched)}"
   [id]="id()" rows="3" [formControl]="textareaControl"></textarea>
</div>
