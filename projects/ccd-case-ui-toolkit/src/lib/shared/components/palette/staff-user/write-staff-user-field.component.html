<div class="form-group" [formGroup]="formGroup">
  <label [for]="id()">
    <span *ngIf="caseField.label" class="form-label">{{ caseField.label }}</span>
  </label>
  <span *ngIf="caseField.hint_text" class="form-hint">{{ caseField.hint_text }}</span>
  <input class="form-control bottom-30" [id]="id()" [formControl]="staffUserControl">
</div>
