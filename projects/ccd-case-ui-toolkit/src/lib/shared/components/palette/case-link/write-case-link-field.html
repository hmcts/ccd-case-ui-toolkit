<div class="govuk-form-group" [ngClass]="{'govuk-form-group--error': !caseReferenceControl.valid && (caseReferenceControl.dirty || caseReferenceControl.touched)}">
  <label class="govuk-label" [for]="id()">
    <ng-container *ngIf="caseField.label">{{caseField | ccdFieldLabel}}</ng-container>
  </label>
  <div class="govuk-hint" *ngIf="caseField.hint_text">{{caseField.hint_text | rpxTranslate}}</div>
  <span class="govuk-error-message" *ngIf="caseReferenceControl.errors && (caseReferenceControl.dirty || caseReferenceControl.touched)">
    <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{caseReferenceControl.errors | ccdFirstError:caseField.label}}
  </span>
  <input class="govuk-input bottom-30" [id]="id()" type="text" [formControl]="caseReferenceControl">
</div>
