<div class="govuk-form-group bottom-30" [id]="id()" [ngClass]="{'govuk-form-group--error': dateControl && !dateControl.valid && (dateControl.dirty || dateControl.touched)}">

  <fieldset class="govuk-fieldset">
    <legend class="govuk-fieldset__legend">
      <ng-container *ngIf="caseField.label">{{(caseField | ccdFieldLabel)}}</ng-container>
    </legend>
    <div class="govuk-hint" *ngIf="caseField.hint_text">{{caseField.hint_text | rpxTranslate}}</div>
    <span class="govuk-error-message" *ngIf="dateControl && dateControl.errors && (dateControl.dirty || dateControl.touched)">
      <span class="govuk-visually-hidden">{{'Error:' | rpxTranslate}}</span> {{(dateControl.errors | ccdFirstError:caseField.label)}}
    </span>
    <cut-date-input [id]="getId()"
                    [isDateTime]="isDateTime()"
                    [mandatory]="caseField | ccdIsMandatory"
                    [isInvalid]="dateControl.errors && (dateControl.dirty || dateControl.touched)"
                    [formControl]="dateControl"></cut-date-input>

  </fieldset>
</div>
