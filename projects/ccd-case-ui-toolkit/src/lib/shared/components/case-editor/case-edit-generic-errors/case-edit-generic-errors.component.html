<!-- Generic error heading and error message to be displayed only if there are no specific callback errors or warnings, or no error details -->
<div *ngIf="error && (!(error.callbackErrors || error.callbackWarnings || error.details) && !error.message)" class="govuk-error-summary" role="group" aria-labelledby="edit-case-event_error-summary-heading" tabindex="-1">
    <h2 class="govuk-error-summary__title" id="edit-case-event_error-summary-heading">
      Something went wrong
    </h2>
    <div class="govuk-error-summary__body" id="edit-case-event_error-summary-body">
      <p class="govuk-body">We're working to fix the problem. Try again shortly.</p>
      <p class="govuk-body"><a href="get-help" target="_blank">Contact us</a> if you're still having problems.</p>
    </div>
  </div>
  <!-- Event error heading and error message to be displayed if there are specific error details -->
  <div *ngIf="error && (error.details || error.message)" class="govuk-error-summary" role="group" aria-labelledby="edit-case-event_error-summary-heading" tabindex="-1">
    <h2 class="govuk-error-summary__title" id="edit-case-event_error-summary-heading">
      The event could not be created
    </h2>
    <div class="govuk-error-summary__body">
      <p class="govuk-body">{{error.message}}</p>
      <ul *ngIf="error.details?.field_errors" class="govuk-list govuk-error-summary__list">
        <li *ngFor="let fieldError of error.details.field_errors">{{fieldError.message}}</li>
      </ul>
    </div>
  </div>
