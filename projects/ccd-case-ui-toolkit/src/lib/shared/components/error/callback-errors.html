<div *ngIf="hasErrors() || hasWarnings()" class="govuk-error-summary"
     [attr.aria-label]="'Cannot continue because the service reported one or more errors or warnings' | rpxTranslate"
     tabindex="-1">
  <div class="govuk-error-summary__body">
    <ng-container *ngIf="hasErrors()">
      <h3 class="govuk-error-summary__title">
        {{'Errors' | rpxTranslate}}
      </h3>
      <ul id="errors" class="govuk-list govuk-error-summary__list">
        <li *ngFor="let errorMsg of error.callbackErrors">
          {{errorMsg}}
        </li>
      </ul>
    </ng-container>
    <!-- Add a break for spacing if there are both errors and warnings -->
    <br *ngIf="hasErrors() && hasWarnings()">
    <ng-container *ngIf="hasWarnings()">
      <h3 class="govuk-error-summary__title">
        {{'Warnings' | rpxTranslate}}
      </h3>
      <ul id="warnings" class="govuk-list govuk-error-summary__list">
        <li *ngFor="let warningMsg of error.callbackWarnings">
          {{warningMsg}}
        </li>
      </ul>
    </ng-container>
  </div>
</div>
