<output class="govuk-visually-hidden" aria-live="polite" aria-atomic="true">
    {{loading ? (loadingText | rpxTranslate) : ''}}
</output>
<div *ngIf="loading" class="spinner-container" aria-hidden="true">
    <div class="spinner-inner-container">
        <p>{{loadingText | rpxTranslate}}</p>
        <div class="spinner" style="margin: auto;"></div>
    </div>
</div>
