<div class="govuk-tabs" data-module="govuk-tabs">

  <ul class="govuk-tabs__list" role="tablist">
    <li
      class="govuk-tabs__list-item"
      [class.govuk-tabs__list-item--selected]="panel.selected"
      role="presentation"
      *ngFor="let panel of panels"
    >
      <a
        class="govuk-tabs__tab"
        [id]="'tab_' + panel.id"
        [routerLink]="['.']"
        [fragment]="panel.id"
        role="tab"
        (click)="show(panel.id)"
        [attr.aria-controls]="panel.id"
        [attr.aria-selected]="panel.selected"
        tabindex="0"
        #tab
      >{{panel.title | rpxTranslate}}</a>
    </li>
  </ul>

  <ng-content></ng-content>

</div>
